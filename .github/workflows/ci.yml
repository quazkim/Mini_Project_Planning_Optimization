name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.9' ]
        ortools: [ 'false', 'true' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ matrix.ortools }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8
          if [ "${{ matrix.ortools }}" = "true" ]; then pip install ortools; fi

      - name: Lint (flake8)
        run: |
          flake8 --max-line-length=120 || true

      - name: Run Greedy smoke test
        run: |
          python3 main.py < test_input/toy.txt > out.txt
          echo "Greedy smoke test output (first line):"
          head -n 1 out.txt

      - name: Run CP-SAT smoke test (only with OR-Tools)
        if: matrix.ortools == 'true'
        run: |
          python3 main.py < test_input/test01.txt > out_cp.txt || true
          echo "CP-SAT smoke test done (exit code ignored to avoid hard failure)."
